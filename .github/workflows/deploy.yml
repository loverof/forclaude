name: Deploy to VPS

on:
  push:
    branches: [claude/remote-control-hv2eb8]
    paths:
      - "index.html"
      - "games.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy site files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "index.html,games.json"
          target: "/var/www/game-roulette/"
          strip_components: 0
