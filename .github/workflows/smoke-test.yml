name: Smoke test VPS site

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check common paths on the VPS
        run: |
          for url in "http://85.155.101.157:8080/" "http://85.155.101.157:8080/index.html" "http://85.155.101.157:8080/games.json"; do
            code=$(curl -sSk -o /tmp/body -w "%{http_code}" --max-time 15 "$url" || echo "ERR")
            echo "== $url -> $code =="
            head -c 300 /tmp/body
            echo
            echo
          done
